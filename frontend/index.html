<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kantinakias</title>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f4f4f9; }
        header { background-color: #790DA1; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { margin: 0; font-size: 24px; }
        .nav-buttons button { margin-left: 10px; padding: 8px 15px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; }
        
        .container { padding: 30px; max-width: 1200px; margin: 0 auto; }
        
        /* Search filters */
        .filters { margin-bottom: 30px; background: rgb(180, 203, 237); padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; gap: 15px; }
        .filters input, .filters select, .filters button { padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .filters button { background-color: #3498db; color: white; border: none; cursor: pointer; font-weight: bold; }
        .filters button:hover { background-color: #2980b9; }
        
        /* Store List */
        .store-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .store-card { background: rgb(180, 203, 237); padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .store-card h3 { margin-top: 0; color: #2c3e50; }
        .btn-menu { background-color: #A42AD4; color: white; border: none; padding: 10px; width: 100%; cursor: pointer; border-radius: 5px; font-size: 16px; margin-top: 15px; }
        .btn-menu:hover { background-color: #A42AD4; }
    </style>
</head>
<body>

    <header>
        <h1>Kantinakias</h1>
        <div class="nav-buttons">
            <button onclick="location.href='login.html'">Sign In</button>
            <button onclick="location.href='register.html'">Register</button>
        </div>
    </header>

    <div class="container">
        <h2>Find your favorite restaurant!</h2>

        <div class="filters">
            <input type="text" id="searchArea" placeholder="Search by region...">
            <select id="cuisineFilter">
                <option value="">All cuisines</option>
                <option value="burger">Burger</option>
                <option value="souvlaki">Souvlaki</option>
                <option value="vegan">Vegan</option>
                <option value="hotdog">Hot Dog</option>
                <option value="pizza">Pizza</option>
                <option value="crepe">Crepe</option>
            </select>
            <button onclick="searchStores()">Search</button>
        </div>

        <div class="store-grid" id="storesList">
           /*Example store cards; in a real application, these would be dynamically generated from the backend */
            <div class="store-card">
                <h3>MAKIS CANTINE</h3>
                <p>Kallithea</p>
                <p>Burger + streetfood</p>
                <button class="btn-menu" onclick="location.href='store.html?id=1'">View Menu</button>
            </div>
            
            <div class="store-card">
                <h3>Vegan Street</h3>
                <p>Exarchia</p>
                <p>Vegan, Falafel</p>
                <button class="btn-menu" onclick="location.href='store.html?id=2'">View Menu</button>
            </div>
        </div>
    </div>

    <script>
        function searchStores() {
            const area = document.getElementById("searchArea").value;
            const cuisine = document.getElementById("cuisineFilter").value;
            alert(`Σύντομα θα αναζητά: Περιοχή="${area}", Κουζίνα="${cuisine}" μέσω του Java API!`);
        }
    </script>

</body>
</html>
